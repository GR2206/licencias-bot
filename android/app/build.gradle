plugins {
    id "com.android.application"
}

android {
    namespace "bot.mesa"
    compileSdk 34

    defaultConfig {
        applicationId "bot.mesa"
        minSdk 24
        targetSdk 34
        versionCode 22
        versionName "22"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
